name: Build VANTA PSP Cheats R1

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PPSSPP_TAG: "v1.20.4"
  ANDROID_SDK_ROOT: "/usr/local/lib/android/sdk"
  ANDROID_HOME: "/usr/local/lib/android/sdk"
  ANDROID_NDK_VERSION: "29.0.14206865"
  VANTA_VERSION_CODE: "120040106"
  VANTA_VERSION_NAME: "0.9.6-cheats-r1"

jobs:
  android-arm64:
    name: VANTA Cheats R1 ARM64
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout VANTA repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -f "$SDKMANAGER" ]; then
            echo "ERRO: sdkmanager nao encontrado."
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;3.22.1"

      - name: Verify VANTA source package
        shell: bash
        run: |
          set -euo pipefail
          test -f "VANTA-PSP-final.zip"
          unzip -t "VANTA-PSP-final.zip"
          test -f "vanta-cheats/apply_vanta_cheats.py"
          python3 -m py_compile "vanta-cheats/apply_vanta_cheats.py"

      - name: Extract VANTA source layer
        shell: bash
        run: |
          set -euo pipefail
          rm -rf vanta-package
          mkdir -p vanta-package
          unzip -q "VANTA-PSP-final.zip" -d vanta-package
          test -f "vanta-package/VANTA-PSP-final/scripts/apply_vanta.py"
          test -f "vanta-package/VANTA-PSP-final/overlay/android/src/org/ppsspp/ppsspp/VantaActivity.java"
          test -f "vanta-package/VANTA-PSP-final/overlay/android/src/org/ppsspp/ppsspp/VantaPrefs.java"
          python3 -m py_compile "vanta-package/VANTA-PSP-final/scripts/apply_vanta.py"

      - name: Fetch PPSSPP engine
        shell: bash
        run: |
          set -euo pipefail
          git clone \
            --branch "$PPSSPP_TAG" \
            --depth 1 \
            --recurse-submodules \
            --shallow-submodules \
            https://github.com/hrydgard/ppsspp.git \
            upstream
          git -C upstream submodule update --init --recursive --depth 1

      - name: Apply VANTA Unified layer
        shell: bash
        run: |
          set -euo pipefail
          python3 vanta-package/VANTA-PSP-final/scripts/apply_vanta.py upstream

      - name: Apply VANTA Cheat Engine R1
        shell: bash
        run: |
          set -euo pipefail
          python3 vanta-cheats/apply_vanta_cheats.py upstream

      - name: Verify VANTA integration
        shell: bash
        run: |
          set -euo pipefail

          grep -q 'applicationId = "com.vantapsp.emulator"' upstream/android/build.gradle.kts
          grep -q 'abiFilters.add("arm64-v8a")' upstream/android/build.gradle.kts
          grep -q 'android:name=".VantaActivity"' upstream/android/AndroidManifest.xml
          test -f upstream/android/src/org/ppsspp/ppsspp/VantaActivity.java
          test -f upstream/android/src/org/ppsspp/ppsspp/VantaPrefs.java
          grep -q 'vantaSetBootConfig' upstream/android/src/org/ppsspp/ppsspp/NativeApp.java
          grep -q 'vantaSetBootConfig' upstream/android/jni/app-android.cpp
          grep -q 'VANTA QUICK TUNE' upstream/UI/PauseScreen.cpp

          grep -q 'VANTA_CHEAT_ENGINE_R1' upstream/UI/CwCheatScreen.cpp
          grep -q 'VANTA_BUILTIN_ULES00390_R1' upstream/UI/CwCheatScreen.cpp
          grep -q '0x205ED688 0x3B9AC9FF' upstream/UI/CwCheatScreen.cpp
          grep -q '0x205ED68C 0x3B9AC9FF' upstream/UI/CwCheatScreen.cpp
          grep -q 'VANTA CHEATS' upstream/UI/PauseScreen.cpp

          echo "VANTA Unified + Cheat Engine R1 verificados."

      - name: Build VANTA Cheats R1 ARM64 APK
        shell: bash
        working-directory: upstream
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8"
        run: |
          set -euo pipefail
          chmod +x gradlew
          java -version
          ./gradlew --version
          ./gradlew \
            :android:assembleNormalOptimized \
            -PANDROID_VERSION_CODE=${VANTA_VERSION_CODE} \
            -PANDROID_VERSION_NAME=${VANTA_VERSION_NAME} \
            --no-daemon \
            --stacktrace

      - name: Locate APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find upstream/android/build/outputs/apk -type f -name '*.apk' | grep -i normal | grep -i optimized | head -n 1 || true)"
          if [ -z "$APK" ]; then
            echo "ERRO: APK normalOptimized nao encontrado."
            find upstream/android/build/outputs -type f -name '*.apk' -print || true
            exit 1
          fi
          echo "$APK" > /tmp/vanta_apk_path
          echo "APK: $APK"

      - name: Validate APK identity
        shell: bash
        run: |
          set -euo pipefail
          APK="$(cat /tmp/vanta_apk_path)"
          AAPT="$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt"
          "$AAPT" dump badging "$APK" > /tmp/vanta_badging.txt
          grep -q "package: name='com.vantapsp.emulator'" /tmp/vanta_badging.txt
          grep -q "launchable-activity: name='org.ppsspp.ppsspp.VantaActivity'" /tmp/vanta_badging.txt
          grep -q "versionName='${VANTA_VERSION_NAME}'" /tmp/vanta_badging.txt

      - name: Package final APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(cat /tmp/vanta_apk_path)"
          mkdir -p dist
          cp "$APK" dist/VANTA-PSP-Cheats-R1-arm64.apk
          sha256sum dist/VANTA-PSP-Cheats-R1-arm64.apk > dist/VANTA-PSP-Cheats-R1-arm64.apk.sha256
          ls -lh dist/VANTA-PSP-Cheats-R1-arm64.apk
          cat dist/VANTA-PSP-Cheats-R1-arm64.apk.sha256

      - name: Upload VANTA Cheats R1 APK
        uses: actions/upload-artifact@v7
        with:
          name: VANTA-PSP-Cheats-R1-arm64
          path: |
            dist/VANTA-PSP-Cheats-R1-arm64.apk
            dist/VANTA-PSP-Cheats-R1-arm64.apk.sha256
          if-no-files-found: error
          retention-days: 14
