name: Build VANTA PSP Unified

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PPSSPP_TAG: "v1.20.4"
  ANDROID_SDK_ROOT: "/usr/local/lib/android/sdk"
  ANDROID_HOME: "/usr/local/lib/android/sdk"
  ANDROID_NDK_VERSION: "29.0.14206865"
  VANTA_VERSION_CODE: "120040104"
  VANTA_VERSION_NAME: "0.9.4-r5"

jobs:
  android-arm64:
    name: VANTA Unified ARM64
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout VANTA repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID SDK:"
          echo "$ANDROID_SDK_ROOT"

          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"

          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            echo "sdkmanager latest não encontrado. Procurando versão instalada..."

            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" \
              -type f \
              -name sdkmanager \
              | sort -V \
              | tail -n 1)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -f "$SDKMANAGER" ]; then
            echo "ERRO: sdkmanager não encontrado."
            exit 1
          fi

          echo "sdkmanager:"
          echo "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;3.22.1"

          echo ""
          echo "Android SDK pronto."

      - name: Verify VANTA final package
        shell: bash
        run: |
          set -euo pipefail

          echo "Arquivos presentes no repositório:"
          ls -lah

          if [ ! -f "VANTA-PSP-final.zip" ]; then
            echo ""
            echo "ERRO:"
            echo "VANTA-PSP-final.zip não foi encontrado na raiz."
            exit 1
          fi

          echo ""
          echo "Testando integridade do ZIP..."

          unzip -t "VANTA-PSP-final.zip"

          echo ""
          echo "ZIP íntegro."

      - name: Extract VANTA source layer
        shell: bash
        run: |
          set -euo pipefail

          rm -rf vanta-package
          mkdir -p vanta-package

          unzip -q "VANTA-PSP-final.zip" -d vanta-package

          echo "Conteúdo VANTA:"

          find vanta-package \
            -maxdepth 10 \
            -type f \
            -print

          test -f \
            "vanta-package/VANTA-PSP-final/scripts/apply_vanta.py"

          test -f \
            "vanta-package/VANTA-PSP-final/overlay/android/src/org/ppsspp/ppsspp/VantaActivity.java"

          test -f \
            "vanta-package/VANTA-PSP-final/overlay/android/src/org/ppsspp/ppsspp/VantaPrefs.java"

          echo ""
          echo "Estrutura VANTA encontrada."

      - name: Validate VANTA patcher
        shell: bash
        run: |
          set -euo pipefail

          python3 -m py_compile \
            vanta-package/VANTA-PSP-final/scripts/apply_vanta.py

          echo "Patcher Python válido."

      - name: Fetch PPSSPP 1.20.4 engine
        shell: bash
        run: |
          set -euo pipefail

          echo "Clonando PPSSPP ${PPSSPP_TAG}..."

          git clone \
            --branch "$PPSSPP_TAG" \
            --depth 1 \
            --recurse-submodules \
            --shallow-submodules \
            https://github.com/hrydgard/ppsspp.git \
            upstream

          echo ""
          echo "Garantindo submódulos..."

          git -C upstream submodule update \
            --init \
            --recursive \
            --depth 1

          echo ""
          echo "PPSSPP ${PPSSPP_TAG} pronto."

      - name: Apply VANTA Unified layer
        shell: bash
        run: |
          set -euo pipefail

          python3 \
            vanta-package/VANTA-PSP-final/scripts/apply_vanta.py \
            upstream

          echo ""
          echo "VANTA aplicado."

      - name: Verify source integration
        shell: bash
        run: |
          set -euo pipefail

          echo "Verificando package..."

          grep -q \
            'applicationId = "com.vantapsp.emulator"' \
            upstream/android/build.gradle.kts

          echo "Package OK."

          echo ""
          echo "Verificando ARM64..."

          grep -q \
            'abiFilters.add("arm64-v8a")' \
            upstream/android/build.gradle.kts

          echo "ARM64 OK."

          echo ""
          echo "Verificando launcher VANTA..."

          grep -q \
            'android:name=".VantaActivity"' \
            upstream/android/AndroidManifest.xml

          echo "Launcher OK."

          echo ""
          echo "Verificando interface VANTA..."

          test -f \
            upstream/android/src/org/ppsspp/ppsspp/VantaActivity.java

          test -f \
            upstream/android/src/org/ppsspp/ppsspp/VantaPrefs.java

          echo "Interface OK."

          echo ""
          echo "Verificando ponte Java -> Native..."

          grep -q \
            'vantaSetBootConfig' \
            upstream/android/src/org/ppsspp/ppsspp/NativeApp.java

          grep -q \
            'vantaSetBootConfig' \
            upstream/android/jni/app-android.cpp

          echo "JNI OK."

          echo ""
          echo "Verificando aplicação do perfil ao core..."

          grep -q \
            'g_Config.iInternalResolution' \
            upstream/android/jni/app-android.cpp

          grep -q \
            'g_Config.iFrameSkip' \
            upstream/android/jni/app-android.cpp

          grep -q \
            'g_Config.bFastMemory' \
            upstream/android/jni/app-android.cpp

          grep -q \
            'g_Config.bHardwareTransform' \
            upstream/android/jni/app-android.cpp

          echo "Core profile bridge OK."

          echo ""
          echo "Verificando VANTA Quick Tune..."

          grep -q \
            'VANTA: native quick-tune menu replaces the generic PPSSPP settings entry.' \
            upstream/UI/PauseScreen.cpp

          grep -q \
            'VANTA QUICK TUNE' \
            upstream/UI/PauseScreen.cpp

          grep -q \
            'g_Config.iInternalResolution' \
            upstream/UI/PauseScreen.cpp

          grep -q \
            'g_Config.iFrameSkip' \
            upstream/UI/PauseScreen.cpp

          grep -q \
            'g_Config.bAutoFrameSkip' \
            upstream/UI/PauseScreen.cpp

          echo "VANTA Quick Tune OK."

          echo ""
          echo "TODAS AS VERIFICAÇÕES DE INTEGRAÇÃO PASSARAM."

      - name: Build VANTA Unified ARM64 APK
        shell: bash
        working-directory: upstream
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8"
        run: |
          set -euo pipefail

          chmod +x gradlew

          echo "Java:"
          java -version

          echo ""
          echo "Gradle:"
          ./gradlew --version

          echo ""
          echo "Compilando VANTA ${VANTA_VERSION_NAME}..."

          ./gradlew \
            :android:assembleNormalOptimized \
            -PANDROID_VERSION_CODE=${VANTA_VERSION_CODE} \
            -PANDROID_VERSION_NAME=${VANTA_VERSION_NAME} \
            --no-daemon \
            --stacktrace

      - name: Locate VANTA APK
        shell: bash
        run: |
          set -euo pipefail

          echo "APKs gerados:"

          find upstream/android/build/outputs \
            -type f \
            -name "*.apk" \
            -print \
            || true

          APK="$(find upstream/android/build/outputs/apk \
            -type f \
            -name "*.apk" \
            | grep -i normal \
            | grep -i optimized \
            | head -n 1 \
            || true)"

          if [ -z "$APK" ]; then
            echo ""
            echo "ERRO: APK normalOptimized não encontrado."
            exit 1
          fi

          echo ""
          echo "APK encontrado:"
          echo "$APK"

          echo "$APK" > /tmp/vanta_apk_path

      - name: Validate compiled APK identity
        shell: bash
        run: |
          set -euo pipefail

          APK="$(cat /tmp/vanta_apk_path)"

          AAPT="$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt"

          if [ ! -x "$AAPT" ]; then
            echo "ERRO: aapt não encontrado."
            exit 1
          fi

          echo "Inspecionando APK final..."

          "$AAPT" dump badging "$APK" \
            > /tmp/vanta_badging.txt

          head -n 20 /tmp/vanta_badging.txt

          echo ""
          echo "Verificando package final..."

          grep -q \
            "package: name='com.vantapsp.emulator'" \
            /tmp/vanta_badging.txt

          echo "Package final OK."

          echo ""
          echo "Verificando launcher final..."

          grep -q \
            "launchable-activity: name='org.ppsspp.ppsspp.VantaActivity'" \
            /tmp/vanta_badging.txt

          echo "Launcher VANTA final OK."

          echo ""
          echo "Verificando versão..."

          grep -q \
            "versionName='${VANTA_VERSION_NAME}'" \
            /tmp/vanta_badging.txt

          echo "Versão ${VANTA_VERSION_NAME} OK."

          echo ""
          echo "APK VALIDADO."

      - name: Package final APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(cat /tmp/vanta_apk_path)"

          mkdir -p dist

          cp \
            "$APK" \
            dist/VANTA-PSP-Unified-arm64.apk

          sha256sum \
            dist/VANTA-PSP-Unified-arm64.apk \
            > dist/VANTA-PSP-Unified-arm64.apk.sha256

          echo ""
          echo "SHA-256:"
          cat dist/VANTA-PSP-Unified-arm64.apk.sha256

          echo ""
          echo "Arquivo final:"
          ls -lh dist/VANTA-PSP-Unified-arm64.apk

      - name: Upload VANTA Unified APK
        uses: actions/upload-artifact@v7
        with:
          name: VANTA-PSP-Unified-arm64
          path: |
            dist/VANTA-PSP-Unified-arm64.apk
            dist/VANTA-PSP-Unified-arm64.apk.sha256
          if-no-files-found: error
          retention-days: 14
