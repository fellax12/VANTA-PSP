name: Build VANTA PSP

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  PPSSPP_TAG: "v1.20.4"
  ANDROID_SDK_ROOT: "/usr/local/lib/android/sdk"
  ANDROID_HOME: "/usr/local/lib/android/sdk"
  ANDROID_NDK_VERSION: "29.0.14206865"

jobs:
  android-arm64:
    name: Android ARM64 optimized
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID SDK:"
          echo "$ANDROID_SDK_ROOT"

          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"

          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            echo "sdkmanager latest não encontrado, procurando outra versão..."

            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -f "$SDKMANAGER" ]; then
            echo "ERRO: sdkmanager não encontrado."
            exit 1
          fi

          echo "Usando:"
          echo "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.14206865" \
            "cmake;3.22.1"

          echo "Android SDK pronto."

          ls -la "$ANDROID_SDK_ROOT/ndk" || true
          ls -la "$ANDROID_SDK_ROOT/cmake" || true

      - name: Verify VANTA package
        shell: bash
        run: |
          set -euo pipefail

          echo "Arquivos na raiz:"
          ls -la

          if [ ! -f "VANTA-PSP-v0.1-upload.zip" ]; then
            echo ""
            echo "ERRO:"
            echo "O arquivo VANTA-PSP-v0.1-upload.zip não está na raiz do repositório."
            echo ""
            exit 1
          fi

          echo "Pacote VANTA encontrado."

      - name: Extract VANTA layer
        shell: bash
        run: |
          set -euo pipefail

          rm -rf vanta-package
          mkdir -p vanta-package

          unzip -q "VANTA-PSP-v0.1-upload.zip" -d vanta-package

          echo "Conteúdo extraído:"
          find vanta-package -maxdepth 8 -type f -print

          test -f "vanta-package/VANTA-PSP-upload/scripts/apply_vanta.py"

          echo "VANTA layer pronta."

      - name: Fetch PPSSPP engine
        shell: bash
        run: |
          set -euo pipefail

          echo "Baixando PPSSPP ${PPSSPP_TAG}..."

          git clone \
            --branch "$PPSSPP_TAG" \
            --depth 1 \
            --recurse-submodules \
            --shallow-submodules \
            https://github.com/hrydgard/ppsspp.git \
            upstream

          echo "Atualizando submódulos..."

          git -C upstream submodule update \
            --init \
            --recursive \
            --depth 1

          echo "Engine pronta."

      - name: Apply VANTA layer
        shell: bash
        run: |
          set -euo pipefail

          python3 \
            vanta-package/VANTA-PSP-upload/scripts/apply_vanta.py \
            upstream

          echo ""
          echo "Patch VANTA aplicado."

          grep -n "VANTA PSP" \
            upstream/android/res/values/strings.xml \
            || true

      - name: Verify ARM64 configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "Verificando configuração ARM64..."

          grep -n \
            'abiFilters.add("arm64-v8a")' \
            upstream/android/build.gradle.kts

          echo "ARM64 configurado corretamente."

      - name: Build optimized ARM64 APK
        shell: bash
        working-directory: upstream
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8"
        run: |
          set -euo pipefail

          chmod +x gradlew

          echo "Java:"
          java -version

          echo ""
          echo "Gradle:"
          ./gradlew --version

          echo ""
          echo "Iniciando compilação VANTA..."

          ./gradlew \
            :android:assembleNormalOptimized \
            --no-daemon \
            --stacktrace

      - name: Locate generated APK
        shell: bash
        run: |
          set -euo pipefail

          echo "Procurando APK..."

          find upstream/android/build/outputs \
            -type f \
            -name "*.apk" \
            -print \
            || true

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist

          APK="$(find upstream/android/build/outputs/apk \
            -type f \
            -name "*.apk" \
            | grep -i normal \
            | grep -i optimized \
            | head -n 1 \
            || true)"

          if [ -z "$APK" ]; then
            echo ""
            echo "ERRO: APK optimized não encontrado."
            echo ""

            find upstream/android/build/outputs \
              -type f \
              -print \
              || true

            exit 1
          fi

          echo "APK encontrado:"
          echo "$APK"

          cp \
            "$APK" \
            dist/VANTA-PSP-arm64.apk

          sha256sum \
            dist/VANTA-PSP-arm64.apk \
            > dist/VANTA-PSP-arm64.apk.sha256

          echo ""
          echo "SHA-256:"
          cat dist/VANTA-PSP-arm64.apk.sha256

          echo ""
          echo "Tamanho:"
          ls -lh dist/VANTA-PSP-arm64.apk

      - name: Upload VANTA APK
        uses: actions/upload-artifact@v7
        with:
          name: VANTA-PSP-arm64
          path: |
            dist/VANTA-PSP-arm64.apk
            dist/VANTA-PSP-arm64.apk.sha256
          if-no-files-found: error
          retention-days: 14
