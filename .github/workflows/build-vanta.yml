name: Build VANTA PSP

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-vanta.yml"

permissions:
  contents: read

env:
  PPSSPP_TAG: "v1.20.4"
  ANDROID_NDK_VERSION: "29.0.14206865"
  VANTA_LAYER_B64: ""

jobs:
  android-arm64:
    name: Android ARM64 optimized
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;${ANDROID_NDK_VERSION}" "cmake;3.22.1"

      - name: Materialize VANTA layer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vanta-layer
          printf '%s' "${VANTA_LAYER_B64}" | base64 --decode > /tmp/vanta-layer.tar.gz
          tar -xzf /tmp/vanta-layer.tar.gz -C vanta-layer
          test -f vanta-layer/scripts/apply_vanta.py
          echo "VANTA layer ready."
          find vanta-layer -maxdepth 8 -type f -print

      - name: Fetch PPSSPP engine
        shell: bash
        run: |
          set -euo pipefail
          git clone --branch "${PPSSPP_TAG}" --depth 1 --recurse-submodules --shallow-submodules https://github.com/hrydgard/ppsspp.git upstream
          git -C upstream submodule update --init --recursive --depth 1

      - name: Apply VANTA layer
        shell: bash
        run: |
          set -euo pipefail
          python3 vanta-layer/scripts/apply_vanta.py upstream

      - name: Build optimized ARM64 APK
        shell: bash
        working-directory: upstream
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx6g"
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :android:assembleNormalOptimized --no-daemon --stacktrace

      - name: Collect APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          APK="$(find upstream/android/build/outputs/apk -type f -name "*.apk" | grep -i normal | grep -i optimized | head -n 1 || true)"
          if [ -z "$APK" ]; then
            echo "Optimized APK was not found." >&2
            find upstream/android/build/outputs -maxdepth 8 -type f -print || true
            exit 1
          fi
          cp "$APK" dist/VANTA-PSP-arm64.apk
          sha256sum dist/VANTA-PSP-arm64.apk > dist/VANTA-PSP-arm64.apk.sha256
          cat dist/VANTA-PSP-arm64.apk.sha256

      - name: Upload VANTA APK
        uses: actions/upload-artifact@v7
        with:
          name: VANTA-PSP-arm64
          path: dist/*
          if-no-files-found: error
          retention-days: 14
