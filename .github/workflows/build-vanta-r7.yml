name: Build VANTA PSP Memory R2 + Library UI R7

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PPSSPP_TAG: "v1.20.4"
  ANDROID_SDK_ROOT: "/usr/local/lib/android/sdk"
  ANDROID_HOME: "/usr/local/lib/android/sdk"
  ANDROID_NDK_VERSION: "29.0.14206865"
  VANTA_VERSION_CODE: "120040108"
  VANTA_VERSION_NAME: "0.9.8-library-r7"

jobs:
  android-arm64:
    name: VANTA Memory R2 + Library UI R7 ARM64
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout VANTA repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -f "$SDKMANAGER" ]; then
            echo "ERRO: sdkmanager nao encontrado."
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;3.22.1"

      - name: Verify all VANTA inputs
        shell: bash
        run: |
          set -euo pipefail
          test -f VANTA-PSP-final.zip
          unzip -t VANTA-PSP-final.zip
          test -f apply_vanta_cheats.py
          test -f apply_vanta_scanner_r2.py
          test -f apply_vanta_library_r7.py
          python3 -m py_compile \
            apply_vanta_cheats.py \
            apply_vanta_scanner_r2.py \
            apply_vanta_library_r7.py

      - name: Extract VANTA source layer
        shell: bash
        run: |
          set -euo pipefail
          rm -rf vanta-package
          mkdir -p vanta-package
          unzip -q VANTA-PSP-final.zip -d vanta-package
          test -f vanta-package/VANTA-PSP-final/scripts/apply_vanta.py
          test -f vanta-package/VANTA-PSP-final/overlay/android/src/org/ppsspp/ppsspp/VantaActivity.java
          test -f vanta-package/VANTA-PSP-final/overlay/android/src/org/ppsspp/ppsspp/VantaPrefs.java
          python3 -m py_compile vanta-package/VANTA-PSP-final/scripts/apply_vanta.py

      - name: Fetch pinned PPSSPP engine
        shell: bash
        run: |
          set -euo pipefail
          git clone \
            --branch "$PPSSPP_TAG" \
            --depth 1 \
            --recurse-submodules \
            --shallow-submodules \
            https://github.com/hrydgard/ppsspp.git \
            upstream
          git -C upstream submodule update --init --recursive --depth 1

      - name: Apply VANTA Unified layer
        shell: bash
        run: |
          set -euo pipefail
          python3 vanta-package/VANTA-PSP-final/scripts/apply_vanta.py upstream

      - name: Apply existing VANTA Cheat Engine R1
        shell: bash
        run: |
          set -euo pipefail
          python3 apply_vanta_cheats.py upstream

      - name: Apply native VANTA Memory Scanner R2
        shell: bash
        run: |
          set -euo pipefail
          python3 apply_vanta_scanner_r2.py upstream

      - name: Apply VANTA Library UI R7
        shell: bash
        run: |
          set -euo pipefail
          python3 apply_vanta_library_r7.py upstream

      - name: Verify VANTA native integration
        shell: bash
        run: |
          set -euo pipefail

          # Identity / engine bridge from the known-good VANTA base.
          grep -q 'applicationId = "com.vantapsp.emulator"' upstream/android/build.gradle.kts
          grep -q 'abiFilters.add("arm64-v8a")' upstream/android/build.gradle.kts
          grep -q 'android:name=".VantaActivity"' upstream/android/AndroidManifest.xml
          test -f upstream/android/src/org/ppsspp/ppsspp/VantaActivity.java
          test -f upstream/android/src/org/ppsspp/ppsspp/VantaPrefs.java
          grep -q 'vantaSetBootConfig' upstream/android/src/org/ppsspp/ppsspp/NativeApp.java
          grep -q 'vantaSetBootConfig' upstream/android/jni/app-android.cpp
          grep -q 'VANTA QUICK TUNE' upstream/UI/PauseScreen.cpp

          # Preserve the already-tested Cheat Engine + Memory Scanner R2.
          grep -q 'VANTA CHEATS' upstream/UI/PauseScreen.cpp
          grep -q 'VANTA_CHEAT_ENGINE_R1' upstream/UI/CwCheatScreen.cpp
          grep -q 'VANTA_MEMORY_SCANNER_R2' upstream/UI/CwCheatScreen.cpp
          grep -q 'VantaBeginUnknown' upstream/UI/CwCheatScreen.cpp
          grep -q 'VantaNextScan' upstream/UI/CwCheatScreen.cpp
          grep -q 'VantaWrite' upstream/UI/CwCheatScreen.cpp
          grep -q 'VANTA_R2_' upstream/UI/CwCheatScreen.cpp

          # R7 touches launcher UI only.
          grep -q 'VANTA_LIBRARY_UI_R7' upstream/android/src/org/ppsspp/ppsspp/VantaActivity.java
          grep -q 'vantaHandleAnalogNavigation' upstream/android/src/org/ppsspp/ppsspp/VantaActivity.java
          grep -q 'vantaMoveControllerFocus' upstream/android/src/org/ppsspp/ppsspp/VantaActivity.java
          grep -q 'REQ_PICK_COVER' upstream/android/src/org/ppsspp/ppsspp/VantaActivity.java
          grep -q 'static String coverUri' upstream/android/src/org/ppsspp/ppsspp/VantaPrefs.java

          echo "Memory Scanner R2 preserved; Library UI R7 source hooks verified."

      - name: Build VANTA Memory R2 + Library UI R7 ARM64 APK
        shell: bash
        working-directory: upstream
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8"
        run: |
          set -euo pipefail
          chmod +x gradlew
          java -version
          ./gradlew --version
          ./gradlew \
            :android:assembleNormalOptimized \
            -PANDROID_VERSION_CODE=${VANTA_VERSION_CODE} \
            -PANDROID_VERSION_NAME=${VANTA_VERSION_NAME} \
            --no-daemon \
            --stacktrace

      - name: Locate APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find upstream/android/build/outputs/apk -type f -name '*.apk' | grep -i normal | grep -i optimized | head -n 1 || true)"
          if [ -z "$APK" ]; then
            echo "ERRO: APK normalOptimized nao encontrado."
            find upstream/android/build/outputs -type f -name '*.apk' -print || true
            exit 1
          fi
          echo "$APK" > /tmp/vanta_apk_path
          echo "APK: $APK"

      - name: Validate APK identity
        shell: bash
        run: |
          set -euo pipefail
          APK="$(cat /tmp/vanta_apk_path)"
          AAPT="$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt"
          "$AAPT" dump badging "$APK" > /tmp/vanta_badging.txt
          grep -q "package: name='com.vantapsp.emulator'" /tmp/vanta_badging.txt
          grep -q "launchable-activity: name='org.ppsspp.ppsspp.VantaActivity'" /tmp/vanta_badging.txt
          grep -q "versionName='${VANTA_VERSION_NAME}'" /tmp/vanta_badging.txt

      - name: Package final APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(cat /tmp/vanta_apk_path)"
          mkdir -p dist
          cp "$APK" dist/VANTA-PSP-Memory-R2-UI-R7-arm64.apk
          sha256sum dist/VANTA-PSP-Memory-R2-UI-R7-arm64.apk > dist/VANTA-PSP-Memory-R2-UI-R7-arm64.apk.sha256
          ls -lh dist/VANTA-PSP-Memory-R2-UI-R7-arm64.apk
          cat dist/VANTA-PSP-Memory-R2-UI-R7-arm64.apk.sha256

      - name: Upload VANTA Memory R2 + Library UI R7 APK
        uses: actions/upload-artifact@v7
        with:
          name: VANTA-PSP-Memory-R2-UI-R7-arm64
          path: |
            dist/VANTA-PSP-Memory-R2-UI-R7-arm64.apk
            dist/VANTA-PSP-Memory-R2-UI-R7-arm64.apk.sha256
          if-no-files-found: error
          retention-days: 14
